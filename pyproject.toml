[project]
name = "substrate"
version = "0.1.0"
description = "GPU-native MARL simulation substrate"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]",
    "flax",
    "optax",
    "orbax-checkpoint",
    "chex",
    "distrax",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate"]
